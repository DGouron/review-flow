    async function checkForUpdates() {
      setVersionCheckState('checking', t);
      try {
        const response = await fetch(`${API_URL}/api/version/check`);
        const data = await response.json();
        const versionUpdateArea = document.getElementById('version-update-area');
        if (versionUpdateArea) {
          versionUpdateArea.innerHTML = renderVersionUpdateArea(
            { currentVersion: data.currentVersion || '?', updateAvailable: data.updateAvailable || false, latestVersion: data.latestVersion || null, installType: data.installType || 'global-npm' },
            t
          );
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        if (!data.updateAvailable) {
          showToast(t('version.upToDate'), 'success');
        }
      } catch (error) {
        console.error('Error checking for updates:', error);
        showToast(t('version.updateFailed'), 'error');
      } finally {
        setVersionCheckState('idle', t);
      }
    }

    async function triggerVersionUpdate() {
      setVersionCheckState('updating', t);
      try {
        const response = await fetch(`${API_URL}/api/version/update`, { method: 'POST' });
        const data = await response.json();
        if (data.status === 'started') {
          setVersionCheckState('restarting', t);
          showToast(t('version.restarting'), 'info');
          setTimeout(() => {
            const checkInterval = setInterval(async () => {
              try {
                const healthResponse = await fetch(`${API_URL}/health`);
                if (healthResponse.ok) {
                  clearInterval(checkInterval);
                  window.location.reload();
                }
              } catch {
                // Server still restarting, keep polling
              }
            }, 2000);
            setTimeout(() => clearInterval(checkInterval), 60000);
          }, 3000);
        } else if (data.status === 'permission-denied') {
          setVersionCheckState('idle', t);
          showManualUpdateCommand(data.command);
        } else if (data.status === 'source-checkout') {
          setVersionCheckState('idle', t);
          showManualUpdateCommand(data.manualCommand);
        } else {
          showToast(data.error || t('version.updateFailed'), 'error');
          setVersionCheckState('idle', t);
        }
      } catch (error) {
        console.error('Error triggering update:', error);
        showToast(t('version.updateFailed'), 'error');
        setVersionCheckState('idle', t);
      }
    }

    let lastWorktreeTotals = { total: null, active: null, idle: null, stale: null };

    async function loadAnimeApi() {
      if (prefersReducedMotion) return null;
      if (animeApi !== null) return animeApi;
      try {
        animeApi = await import('./vendor/anime.esm.min.js');
        return animeApi;
      } catch (error) {

    function bindWorktreeSweepButton() {
      const button = worktreeSection?.querySelector('[data-action="sweep"]');
      if (!button) return;
      button.addEventListener('click', async () => {
        if (button.dataset.busy === '1') return;
        button.dataset.busy = '1';
        const label = button.querySelector('.worktree-sweep-label');
        const previousLabel = label?.textContent ?? 'SWEEP NOW';
        if (label) label.textContent = 'SWEEPING…';
        button.classList.add('worktree-sweep-pending');

        const anime = await loadAnimeApi();
        const broom = button.querySelector('.worktree-sweep-broom');
        if (anime && broom) {
          anime.animate(broom, {
            translateX: [{ from: -6, to: 22 }],
            opacity: [{ from: 0.6, to: 1 }],
            duration: 700,
            easing: 'easeInOutQuad',
          });
        }

        try {
          const result = await triggerManualSweep();
          if (result.status === 'conflict') {
            button.classList.add('worktree-sweep-conflict');
            window.setTimeout(() => button.classList.remove('worktree-sweep-conflict'), 1200);
          } else if (result.status === 'error') {
            button.classList.add('worktree-sweep-error');
            window.setTimeout(() => button.classList.remove('worktree-sweep-error'), 1200);
          }
        } finally {
          if (label) label.textContent = previousLabel;
          button.classList.remove('worktree-sweep-pending');
          button.dataset.busy = '0';
          await refreshWorktreeSection({ animate: true });
        }
      });
    }

    function animateWorktreeMetrics() {
      if (prefersReducedMotion || worktreeSection === null) return;
      loadAnimeApi().then((anime) => {
        if (anime === null) return;
        const metrics = worktreeSection.querySelectorAll('.worktree-metric-value');
        if (metrics.length === 0) return;
        anime.animate(metrics, {
          opacity: [{ from: 0, to: 1 }],
          translateY: [{ from: 4, to: 0 }],
          duration: 400,
          delay: anime.stagger(40),
          easing: 'easeOutQuad',
        });
        const rows = worktreeSection.querySelectorAll('.worktree-row');
        if (rows.length === 0) return;
        anime.animate(rows, {
          opacity: [{ from: 0, to: 1 }],
          translateY: [{ from: 2, to: 0 }],
          duration: 260,
          delay: anime.stagger(25),
          easing: 'easeOutQuad',
        });
      }).catch(() => {});
    }

    function flashChangedMetrics(nextTotals) {
      if (prefersReducedMotion || worktreeSection === null) return;
      const changedKeys = computeChangedMetricKeys(lastWorktreeTotals, nextTotals);
      if (changedKeys.length === 0) return;
      const changed = [];
      for (const key of changedKeys) {
        const el = worktreeSection.querySelector(`.worktree-metric-value[data-metric="${key}"]`);
        if (el) changed.push(el);
      }
      if (changed.length === 0) return;
      loadAnimeApi().then((anime) => {
        if (anime === null) return;
        anime.animate(changed, {
          backgroundColor: [{ from: 'rgba(255, 138, 61, 0.18)', to: 'rgba(255, 138, 61, 0)' }],
          duration: 600,
          easing: 'easeOutQuad',
        });
      }).catch(() => {});
    }

    function bindForceCleanupButtons() {
      if (worktreeSection === null) return;
      const buttons = worktreeSection.querySelectorAll('[data-action="force-cleanup"]');
      buttons.forEach((button) => {
        button.addEventListener('click', async () => {
          if (button.dataset.busy === '1') return;
          const platform = button.dataset.platform;
          const projectPath = button.dataset.projectPath;
          const mrNumber = Number(button.dataset.mrNumber);
          if (!platform || !projectPath || Number.isNaN(mrNumber)) return;

          button.dataset.busy = '1';
          try {
            const result = await triggerForceCleanup({ platform, projectPath, mrNumber });
            if (result.status !== 'ok') {
              button.classList.add('worktree-cleanup-failed');
              window.setTimeout(() => button.classList.remove('worktree-cleanup-failed'), 1200);
            }
          } finally {
            button.dataset.busy = '0';
            await refreshWorktreeSection({ animate: true });
          }
        });
      });
    }

    async function refreshWorktreeSection({ animate } = { animate: false }) {
      if (worktreeSection === null) return;
      try {
        const viewModel = await fetchWorktreeOverview();
        const totals = snapshotTotals(viewModel);
        worktreeSection.innerHTML = renderWorktreeSection(viewModel);
        bindWorktreeSweepButton();
        bindForceCleanupButtons();
        if (animate) animateWorktreeMetrics();
        flashChangedMetrics(totals);
        lastWorktreeTotals = totals;
      } catch (error) {
        if (worktreeSection.childElementCount === 0) {
          worktreeSection.innerHTML = '<div class="worktree-panel worktree-panel-error">// WORKTREE POOL · unavailable</div>';
        }
      }
    }

    refreshWorktreeSection({ animate: true });
    setInterval(() => refreshWorktreeSection({ animate: false }), 5000);

    // === Operator's Console boot animations ===

    let heartbeatStop = null;

    async function bootAnimations() {
      const anime = await loadAnimeApi();
      if (!anime) return;

      // Logo breath — daemon-alive signal
      const logo = document.querySelector('.logo');
      if (logo) breatheLogo(logo, { animeApi: anime });

      // Online status dot pulse
      const statusDot = document.querySelector('.status-dot');
      if (statusDot) pulseStatusDot(statusDot, { animeApi: anime });

      // Metric cards stagger mount
      const cards = document.querySelectorAll('.cards > .card');
      if (cards.length > 0) animateMount(cards, { animeApi: anime });

      // Sidebar slide-in
      const sidebar = document.querySelector('.dashboard-sidebar');
      if (sidebar && !reducedMotion()) {
        anime.animate(sidebar, {
          opacity: [{ from: 0, to: 1 }],
          translateX: [{ from: -8, to: 0 }],
          duration: 280,
          easing: 'easeOutCubic',
        });
      }

      // Attention strip mount (focus-strip promoted to main)
      const focusChips = document.querySelectorAll('.focus-chip');
      if (focusChips.length > 0) animateMount(focusChips, { animeApi: anime, staggerMs: 40, yOffset: 8 });

      // Heartbeat on pending-reviews empty state
      startHeartbeat(anime);

      // Card hover lift — wire to existing cards
      wireCardHovers(anime);

      // Settings modal spring-in
      wireSettingsModal(anime);
    }

    function startHeartbeat(anime) {
      const container = document.getElementById('heartbeat-line');
      if (!container) return;
      if (heartbeatStop) heartbeatStop.stop();
      heartbeatStop = heartbeat(container, { animeApi: anime });
    }

    function wireCardHovers(anime) {
      const cards = document.querySelectorAll('.cards > .card');
      for (const card of cards) {
        card.addEventListener('mouseenter', () => liftCard(card, { animeApi: anime }));
        card.addEventListener('mouseleave', () => unliftCard(card, { animeApi: anime }));
      }
    }

    function wireSettingsModal(anime) {
      const modal = document.getElementById('settings-modal');
      if (!modal) return;
      modal.addEventListener('animationsjs-open', () => springIn(modal, { animeApi: anime }));
    }

    // Tab underline glide — set up after tab bar renders
    let tabUnderlineEl = null;

    function setupTabUnderline() {
      const tabBar = document.querySelector('.dashboard-tab-bar');
      if (!tabBar) return;

      if (!tabUnderlineEl) {
        tabUnderlineEl = document.createElement('div');
        tabUnderlineEl.className = 'tab-underline-indicator';
        tabBar.style.position = 'relative';
        tabBar.appendChild(tabUnderlineEl);
      }

      const activeTab = tabBar.querySelector('.is-active');
      if (activeTab) {
        loadAnimeApi().then((anime) => {
          if (anime && tabUnderlineEl) slideTabUnderline(tabUnderlineEl, activeTab, { animeApi: anime });
        }).catch(() => {});
      }
    }

    // Counter animation — wrap renderCardCounters and focus strip to animate changes
    const originalCounterIds = ['running-count', 'queued-count', 'completed-count', 'focus-now-count', 'focus-next-count', 'focus-blocked-count'];
    const previousCounterValues = {};

    function animateCounterChanges(anime) {
      for (const id of originalCounterIds) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (el.dataset.animating === 'true') continue;
        const currentText = el.textContent;
        const currentVal = parseInt(currentText, 10);
        const prevVal = previousCounterValues[id];
        if (!Number.isNaN(currentVal) && prevVal !== undefined && prevVal !== currentVal) {
          el.dataset.animating = 'true';
          animateCounterValue(el, prevVal, currentVal, {
            animeApi: anime,
            onComplete: () => {
              el.dataset.animating = 'false';
              previousCounterValues[id] = currentVal;
            },
          });
        } else if (!Number.isNaN(currentVal)) {
          previousCounterValues[id] = currentVal;
        }
      }
    }

    // Observe counter element changes
    async function observeCounters() {
      const anime = await loadAnimeApi();
      if (!anime) return;

      // Snapshot initial values
      for (const id of originalCounterIds) {
        const el = document.getElementById(id);
        if (el) {
          const val = parseInt(el.textContent, 10);
          if (!Number.isNaN(val)) previousCounterValues[id] = val;
        }
      }

      const observer = new MutationObserver(() => animateCounterChanges(anime));
      for (const id of originalCounterIds) {
        const el = document.getElementById(id);
        if (el) observer.observe(el, { childList: true, characterData: true, subtree: true });
      }
    }

    // Visibility change — pause/resume heartbeat to save battery
    document.addEventListener('visibilitychange', () => {
      loadAnimeApi().then((anime) => {
        if (!anime) return;
        if (document.hidden) {
          if (heartbeatStop) heartbeatStop.stop();
        } else {
          startHeartbeat(anime);
        }
      }).catch(() => {});
    });

    // Ember read-only chat (SPEC-189). The pure decisions + SSE fold live in
    // emberChat.js; this humble init just binds DOM and the reused avatar.
    function initEmberChat() {
      const form = document.getElementById('ember-form');
      const input = document.getElementById('ember-question');
      const thread = document.getElementById('ember-thread');
      const status = document.getElementById('ember-status');
      const retry = document.getElementById('ember-retry');
      const canvas = document.getElementById('ember-avatar');
      const panel = document.getElementById('ember-chat-panel');
      if (!form || !input || !thread || !status || !canvas) return;

      const avatar = mountEmberAvatar({ canvas, initialState: 'idle' });

      const appendBubble = (role, text) => {
        const bubble = document.createElement('div');
        bubble.className = 'ember-chat-panel__msg ember-chat-panel__msg--' + role;
        bubble.textContent = text;
        thread.appendChild(bubble);
        thread.scrollTop = thread.scrollHeight;
        return bubble;
      };

      let lastQuestion = '';
      const ask = async (questionText) => {
        const question = questionText ?? input.value;
        if (!shouldSendQuestion(question)) {
          input.focus();
          return;
        }
        lastQuestion = question;
        panel?.classList.add('ember-chat-panel--active');
        status.textContent = '';
        retry.hidden = true;
        appendBubble('user', question);
        input.value = '';
        input.disabled = true;
        const answerBubble = appendBubble('ember', '');
        answerBubble.classList.add('is-generating');
        answerBubble.innerHTML = '<span class="ember-typing" aria-hidden="true"><i></i><i></i><i></i></span>';
        let errored = false;
        await connectEmberStream({
          question,
          onAnswer: (text) => { answerBubble.innerHTML = markdownToHtml(text); thread.scrollTop = thread.scrollHeight; },
          onAvatarState: (state) => { avatar.setState(state); if (state === 'error') errored = true; },
          onAnnounce: (text) => {
            status.textContent = text;
            if (errored) answerBubble.innerHTML = markdownToHtml(text);
          },
          onRetryVisible: (visible) => { retry.hidden = !visible; },
        });
        answerBubble.classList.remove('is-generating');
        answerBubble.classList.add(errored ? 'is-error' : 'is-answered');
        thread.scrollTop = thread.scrollHeight;
        input.disabled = false;
        input.focus();
      };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        void ask();
      });
      retry.addEventListener('click', () => { void ask(lastQuestion); });
    }

    // Boot animations & observers exactly once, regardless of readyState timing
    let __animationsBooted = false;
    function bootOnce() {
      if (__animationsBooted) return;
      __animationsBooted = true;
      bootAnimations();
      observeCounters();
      initEmberChat();
    }
    if (document.readyState !== 'loading') {
      bootOnce();
    } else {
      window.addEventListener('DOMContentLoaded', bootOnce);
    }
  </script>
</body>
