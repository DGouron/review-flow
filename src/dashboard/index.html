<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewflow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shell.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="shell">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <h1>Reviewflow</h1>
      </div>
      <div class="project-switcher">
        <button type="button" id="project-switcher-toggle" class="btn btn-ghost" data-action="toggle-projects" aria-expanded="false" aria-controls="project-switcher-panel">
          <span id="project-switcher-label" class="project-switcher-label"></span>
          <i data-lucide="chevron-down"></i>
        </button>
        <div id="project-switcher-panel" class="popover popover-start" hidden>
          <nav id="dashboard-tabs" class="dashboard-tab-bar-wrapper" aria-label="Projects"></nav>
          <a href="/setup" class="setup-cta" id="setup-cta"><span id="i18n-setup-cta"></span></a>
          <button type="button" id="manage-projects-toggle" class="manage-projects-toggle" aria-expanded="false" aria-controls="manage-panel">
            <span class="manage-projects-toggle-label" id="i18n-manage-projects"></span>
            <i data-lucide="chevron-down" class="manage-projects-toggle-icon"></i>
          </button>
          <section id="manage-panel" class="manage-panel" aria-label="Manage projects" data-open="false"></section>
        </div>
      </div>
      <span class="separator" aria-hidden="true"></span>
      <nav id="view-nav" class="view-nav" aria-label="Views"></nav>
      <div class="grow"></div>
      <div class="health">
        <button type="button" id="health-pill" class="pill" data-action="toggle-health" aria-expanded="false" aria-controls="health-popover"></button>
        <div id="health-popover" class="popover" role="dialog" aria-labelledby="health-popover-title" hidden>
          <div class="popover-title" id="health-popover-title"></div>
          <div id="health-lines"></div>
          <div class="health-actions">
            <button type="button" id="recheck-claude-btn" class="btn btn-ghost" data-action="recheck-claude"></button>
            <div id="version-update-area" class="version-update-area"></div>
          </div>
          <div id="version-manual-update-container"></div>
        </div>
      </div>
      <span id="header-capacity-badge-slot"></span>
      <button type="button" id="toggle-logs-btn" class="btn btn-icon" onclick="toggleLogs()"><i data-lucide="scroll-text"></i></button>
      <button type="button" id="open-economics-sheet-btn" class="btn btn-icon" onclick="openEconomicsSheet()"><i data-lucide="circuit-board"></i></button>
      <button type="button" id="open-settings-modal-btn" class="btn btn-icon"><i data-lucide="sliders-horizontal"></i></button>
    </div>
  </header>

  <div class="wrap shell-main">
    <div id="claude-login-section" class="notice notice-danger hidden">
      <strong><i data-lucide="alert-triangle"></i> <span id="i18n-claude-login-title"></span></strong>
      <p id="i18n-claude-login-instruction"></p>
      <p><code>claude login</code></p>
      <p id="i18n-claude-login-reload"></p>
    </div>

    <div id="git-login-section" class="notice notice-danger hidden">
      <strong id="git-login-title"><i data-lucide="alert-triangle"></i> <span id="i18n-git-login-title"></span></strong>
      <div id="git-login-instructions"></div>
    </div>

    <div class="shell-body">
      <main class="shell-content">
        <div id="view-queue" class="view" data-view="queue">
          <div id="live-reviews" class="live-reviews"></div>

          <div class="card section hidden" id="pending-reviews-section">
            <div class="section-header">
              <i data-lucide="hourglass"></i> <span id="i18n-section-pending-reviews"></span>
              <span id="pending-reviews-count" class="count hidden">0</span>
            </div>
            <div id="pending-reviews" class="section-content"></div>
          </div>

          <section id="size-block-section" class="size-block-section" aria-label="Merge requests blocked for size"></section>

          <section id="overview-section" class="overview-section" aria-label="Multi-project overview"></section>

          <section id="review-queue" class="card review-queue"></section>

          <details id="completed-reviews-section" class="card completed-reviews">
            <summary><i data-lucide="file-check"></i> <span id="i18n-section-completed-reviews"></span></summary>
            <div id="merged-reviews" class="section-content"></div>
            <div id="recent-reviews" class="section-content"></div>
          </details>

          <div id="data-loading-state" class="data-loading hidden" role="status" aria-live="polite">
            <i data-lucide="loader-circle"></i>
            <span id="i18n-loading-data"></span>
          </div>
        </div>

        <div id="view-team" class="view" data-view="team" hidden>
          <div id="team-section" class="team-view">
            <div class="view-header">
              <h2 id="i18n-section-team"></h2>
              <button type="button" id="open-stats-sheet-btn" class="btn btn-ghost" onclick="openStatsSheet()" disabled aria-disabled="true"><i data-lucide="bar-chart-3"></i> <span id="i18n-open-stats"></span></button>
            </div>
            <div id="team-tab-content" class="section-content">
              <div class="empty-state" id="i18n-empty-team"></div>
            </div>
          </div>
        </div>

        <div id="view-worktrees" class="view" data-view="worktrees" hidden>
          <section id="worktree-section" aria-label="Worktree pool"></section>
          <section class="card section" id="cleanup-section">
            <div class="section-header">
              <i data-lucide="trash-2"></i> <span id="i18n-section-cleanup"></span>
            </div>
            <div class="section-content" id="cleanup-content"></div>
          </section>
        </div>
      </main>

      <aside class="card side-panel" id="side-panel" aria-label="Side panel">
        <div id="panel-tabs" class="segments" role="tablist"></div>
        <div id="panel-pr" class="panel-pr" role="tabpanel"></div>
        <section id="ember-chat-panel" class="ember-chat-panel" role="tabpanel" aria-label="Ember" hidden>
          <div class="ember-chat-panel__header">
            <canvas id="ember-avatar" class="ember-chat-panel__avatar" width="360" height="360" aria-hidden="true"></canvas>
            <div>
              <div class="ember-chat-panel__name" id="i18n-ember-title"></div>
              <div class="ember-chat-panel__subtitle" id="i18n-ember-subtitle"></div>
            </div>
          </div>
          <div id="ember-thread" class="ember-chat-panel__thread" role="log" aria-live="polite" aria-label="Ember"></div>
          <div id="ember-suggestions" class="ember-chat-panel__suggestions"></div>
          <div id="ember-status" class="ember-chat-panel__status visually-hidden" role="status" aria-live="polite"></div>
          <button type="button" id="ember-retry" class="btn btn-ghost ember-chat-panel__retry" hidden></button>
          <form id="ember-form" class="ember-chat-panel__form" autocomplete="off">
            <span id="ember-context" class="ember-context" hidden></span>
            <label class="visually-hidden" for="ember-question" id="i18n-ember-input-label"></label>
            <input type="text" id="ember-question" class="ember-chat-panel__input" />
            <button type="submit" class="btn btn-primary" id="i18n-ember-send"></button>
          </form>
        </section>
      </aside>
    </div>

    <footer class="shell-footer">
      <span class="footer-item"><span id="connection-dot" class="dot dot-checking" aria-hidden="true"></span><span id="connection-mode"></span></span>
      <span id="config-status" class="config-status hidden"></span>
      <div id="config-info" class="config-info hidden"></div>
      <span id="session-metrics" class="footer-item"></span>
    </footer>
  </div>

  <div id="cancel-modal" class="modal-overlay hidden" onclick="closeCancelModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title" id="cancel-modal-title"></div>
      <div class="modal-message" id="i18n-modal-message"></div>
      <div class="modal-actions">
        <button class="btn-modal-back" onclick="closeCancelModal()" id="i18n-modal-back"></button>
        <button class="btn-modal-confirm" id="cancel-modal-confirm" onclick="confirmCancelReview()"></button>
      </div>
    </div>
  </div>

  <div id="mark-merged-modal" class="modal-overlay hidden" onclick="closeMarkMergedModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title" id="mark-merged-modal-title"></div>
      <div class="modal-message" id="i18n-mark-merged-modal-message"></div>
      <div class="modal-actions">
        <button class="btn-modal-back" onclick="closeMarkMergedModal()" id="i18n-mark-merged-modal-back"></button>
        <button class="btn-modal-confirm" id="mark-merged-modal-confirm" onclick="confirmMarkAsMerged()"></button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <div id="mr-sheet-overlay" class="sheet-overlay" onclick="closeMrSheet()"></div>
  <div id="mr-sheet" class="sheet-panel">
    <div id="mr-sheet-content" class="sheet-content"></div>
  </div>

  <div id="dev-sheet-overlay" class="sheet-overlay" onclick="closeDevSheet()"></div>
  <div id="dev-sheet" class="sheet-panel">
    <div id="dev-sheet-content" class="sheet-content"></div>
  </div>

  <div id="economics-sheet-overlay" class="sheet-overlay" onclick="closeEconomicsSheet()"></div>
  <div id="economics-sheet" class="sheet-panel">
    <div id="economics-sheet-content" class="sheet-content">
      <button class="sheet-close" onclick="closeEconomicsSheet()"><i data-lucide="x"></i></button>
      <div class="sheet-mr-header">
        <div class="sheet-mr-title"><i data-lucide="circuit-board"></i> <span id="i18n-section-claude-economics"></span></div>
      </div>
      <div class="economics-panel">
        <div class="economics-panel-header">
          <span class="economics-panel-title" id="i18n-economics-token-usage"></span>
        </div>
        <div class="economics-panel-body" id="token-usage-content">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

      <div class="economics-panel">
        <div class="economics-panel-header">
          <span class="economics-panel-title" id="i18n-economics-monthly-budget"></span>
        </div>
        <div class="economics-panel-body">
          <div id="budget-tile">
            <div class="empty-state">Loading…</div>
          </div>
          <div class="budget-slider-row">
            <label for="budget-slider" id="budget-slider-label">Cap: <span id="budget-slider-value">$200</span></label>
            <input type="range" id="budget-slider" min="0" max="5000" step="50" value="200" />
            <button id="budget-slider-submit" type="button">Apply</button>
            <span id="budget-slider-status" class="budget-slider-status"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <dialog id="settings-modal" class="settings-modal" aria-labelledby="settings-modal-title"></dialog>

  <select id="language-select" style="display:none" aria-hidden="true" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="fr">Français</option>
  </select>

  <script type="module">
    import { t, setLanguage, getLanguage } from './modules/i18n.js';
    import { formatTime, formatDuration, formatPhase, formatLogTime } from './modules/formatting.js';
    import { springIn } from './modules/animations.js';
    import { escapeHtml, markdownToHtml, sanitizeHttpUrl } from './modules/html.js';
    import { getAgentIcon, icon, refreshIcons } from './modules/icons.js';
    import { MAX_RECONNECT_ATTEMPTS, RECONNECT_DELAY, STORAGE_KEY_CURRENT, DEFAULT_TARGET_GRADE } from './modules/constants.js';
    import { buildTabBarModel, renderTabBarHtml, readActiveTab, writeActiveTab } from './modules/tabBar.js';
    import { buildManagePanelModel, renderManagePanelHtml, buildOptimisticAddedRow, validateLocalPathInput } from './modules/managePanel.js';
    import { renderOverviewHtml } from './modules/overview.js';
    import { getDesktopNotificationPayload, shouldNotifyDesktop } from './modules/desktopNotifications.js';
    import { getLoadingPresentation, getQuietRefreshSectionIdentifiers } from './modules/loading.js';
    import { shouldHidePendingReviewsSection } from './modules/sectionVisibility.js';
    import { collectReviewNotifications, createReviewNotificationState } from './modules/notifications.js';
    import { rankPendingFixForNowLane } from './modules/priority.js';
    import { createSessionMetricsState, trackSessionAction, updatePriorityItemTracking, getSessionMetricsSnapshot } from './modules/sessionMetrics.js';
    import { renderCleanupSection, handleCleanupClick } from './modules/cleanup.js';
    import { renderVersionUpdateArea, setVersionCheckState, resolveRefusalWording } from './modules/versionUpdate.js';
    import { renderCollapsibleList, toggleCollapsibleList } from './modules/collapsibleList.js';
    import { renderMrSheetContent, drawGradeTimeline, drawIssuesBreakdown } from './modules/mrSheet.js';
    import { drawGradeTrendChart } from './modules/statsCharts.js';
    import { renderKeyInsightsHtml } from './modules/keyInsights.js';
    import { renderTeamTab, fetchAndRenderTeamTab } from './modules/teamTab.js';
    import { renderDeveloperSheetContent, drawRadarChart } from './modules/developerSheet.js';
    import { buildInsightsReport } from './modules/insightsReport.js';
    import { fetchTokenUsageSummary, renderTokenUsageTile, startOfCurrentMonthUtc } from './modules/tokenUsage.js';
    import { fetchMergeRequestTokenUsage, renderMergeRequestTokenUsage } from './modules/mergeRequestTokenUsage.js';
    import { buildPendingReviewsModel, renderPendingReviewsHtml } from './modules/pendingReviews.js';
    import {
      renderWorktreeSection,
      fetchWorktreeOverview,
      triggerManualSweep,
      triggerForceCleanup,
      snapshotTotals,
      computeChangedMetricKeys,
      formatBytes,
    } from './modules/worktreePanel.js';
    import {
      parseBudgetStatusMessage,
      parseBudgetExceededMessage,
      renderBudgetTile,
      fetchBudget,
      fetchBudgetStatus,
      submitBudget,
    } from './modules/budgetSettings.js';
    import {
      buildSettingsViewModel,
      renderGlobalSettingsHtml,
      renderSettingsModalHtml,
      validateExternalLink,
      validateQualityThreshold,
      validateMaxConcurrentReviews,
      validateMaxDiffLines,
      extractFormPayload,
    } from './modules/settingsModal.js';
    import {
      buildSizeBlockPanelModel,
      renderSizeBlockPanelHtml,
      fetchSizeBlocks,
      triggerForceLaunch,
    } from './modules/sizeBlockPanel.js';
    import {
      buildHeaderCapacityViewModel,
      renderHeaderCapacityBadgeHtml,
    } from './modules/headerCapacityBadge.js';
    import { connectEmberStream, contextualQuestion, shouldSendQuestion } from './modules/emberChat.js';
    import { buildReviewQueueModel, projectSlugOf } from './modules/reviewQueue.js';
    import { renderReviewQueueHtml } from './modules/reviewQueueView.js';
    import { buildPrDetailModel, renderPanelTabsHtml, renderPrDetailHtml } from './modules/prDetailPanel.js';
    import { buildLiveReviewsModel, formatElapsed, renderLiveReviewsHtml } from './modules/liveReviews.js';
    import { buildHealthModel, renderHealthLinesHtml, renderHealthPillHtml } from './modules/healthPill.js';
    import { normalizeView, readActiveView, renderViewNavHtml, writeActiveView } from './modules/viewNavigation.js';
    import { mountEmberAvatar } from './modules/emberAvatarRenderer.js';

    const API_URL = window.location.origin;
    const WS_URL = `ws://${window.location.host}/ws`;

    let ws = null;
    let wsConnected = false;
    let reconnectAttempts = 0;
    let logsVisible = false;

    let currentData = { activeReviews: [], recentReviews: [], logs: [], reviewFiles: [], pendingFix: [], pendingApproval: [], merged: [], closed: [], pendingReviews: [] };
    const mrDataStore = new Map();
    let loadedReviews = {};
    let currentStatsReviews = [];
    let currentInsightsData = null;
    const loadingState = { status: 0, reviewFiles: 0, stats: 0, mrTracking: 0 };
    let hasLoadedStatusOnce = false;
    const quietRefreshSections = ['review-queue', 'completed-reviews-section'];
    const loadingLabelBySource = {
      status: 'loading.status',
      reviewFiles: 'loading.reviewFiles',
      stats: 'loading.stats',
      mrTracking: 'loading.mrTracking',
    };
    let loadingShowTimeout = null;
    let loadingHideTimeout = null;
    let loadingVisibleSince = null;
    const loadingDelayMs = 260;
    const loadingMinimumVisibleMs = 420;

    let sessionMetrics = createSessionMetricsState(Date.now());
    let reviewNotificationState = createReviewNotificationState();

    function setLoadingFlag(source, isLoading) {
      if (!(source in loadingState)) return;
      const nextValue = isLoading
        ? loadingState[source] + 1
        : Math.max(0, loadingState[source] - 1);
      loadingState[source] = nextValue;
      updateLoadingStateUI();
    }

    function applyQuietRefreshSectionIndicators(sectionIdentifiers) {
      quietRefreshSections.forEach((sectionIdentifier) => {
        const section = document.getElementById(sectionIdentifier);
        if (!section) return;
        section.classList.toggle('is-refreshing', sectionIdentifiers.includes(sectionIdentifier));
      });
    }

    function getLoadingMessageKey() {
      const activeSource = Object.entries(loadingState).find(([, value]) => value > 0)?.[0];
      return activeSource ? loadingLabelBySource[activeSource] : 'loading.data';
    }

    function updateLoadingStateUI() {
      const isLoading = Object.values(loadingState).some((value) => value > 0);
      const loadingPresentation = getLoadingPresentation(loadingState, { hasLoadedStatusOnce });
      const loadingElement = document.getElementById('data-loading-state');
      if (!loadingElement) return;

      const loadingLabel = document.getElementById('i18n-loading-data');
      if (loadingLabel) {
        loadingLabel.textContent = t(getLoadingMessageKey());
      }

      if (isLoading) {
        document.body.classList.toggle('is-quiet-refresh', loadingPresentation.isQuietRefresh);
        const quietSectionIdentifiers = getQuietRefreshSectionIdentifiers(loadingState, { hasLoadedStatusOnce });
        applyQuietRefreshSectionIndicators(quietSectionIdentifiers);
        if (!loadingPresentation.showGlobalLoading) {
          if (loadingShowTimeout) {
            clearTimeout(loadingShowTimeout);
            loadingShowTimeout = null;
          }
          if (loadingHideTimeout) {
            clearTimeout(loadingHideTimeout);
            loadingHideTimeout = null;
          }
          loadingVisibleSince = null;
          loadingElement.classList.add('hidden');
          document.body.classList.remove('is-loading-data');
          return;
        }

        if (loadingHideTimeout) {
          clearTimeout(loadingHideTimeout);
          loadingHideTimeout = null;
        }
        if (!loadingVisibleSince && !loadingShowTimeout) {
          loadingShowTimeout = setTimeout(() => {
            loadingElement.classList.remove('hidden');
            document.body.classList.add('is-loading-data');
            loadingVisibleSince = Date.now();
            loadingShowTimeout = null;
            refreshIcons();
          }, loadingDelayMs);
        }
      } else {
        document.body.classList.remove('is-quiet-refresh');
        applyQuietRefreshSectionIndicators([]);
        if (loadingShowTimeout) {
          clearTimeout(loadingShowTimeout);
          loadingShowTimeout = null;
        }
        if (!loadingVisibleSince) {
          loadingElement.classList.add('hidden');
          document.body.classList.remove('is-loading-data');
          return;
        }
        const elapsed = Date.now() - loadingVisibleSince;
        const remaining = Math.max(0, loadingMinimumVisibleMs - elapsed);
        loadingHideTimeout = setTimeout(() => {
          loadingElement.classList.add('hidden');
          document.body.classList.remove('is-loading-data');
          loadingVisibleSince = null;
          loadingHideTimeout = null;
          updateUI();
        }, remaining);
      }
    }

    function formatSessionDuration(milliseconds) {
      const seconds = Math.max(0, Math.floor(milliseconds / 1000));
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes}m ${remainingSeconds}s`;
    }

    function formatActionBreakdown(actionBreakdown) {
      return `${t('metrics.action.followup')} ${actionBreakdown.followup}, ${t('metrics.action.open')} ${actionBreakdown.open}, ${t('metrics.action.approve')} ${actionBreakdown.approve}, ${t('metrics.action.cancelReview')} ${actionBreakdown.cancelReview}, ${t('metrics.action.syncThreads')} ${actionBreakdown.syncThreads}`;
    }

    function updateSessionMetricsUI() {
      const metricsElement = document.getElementById('session-metrics');
      if (!metricsElement) return;

      const metricsSnapshot = getSessionMetricsSnapshot(sessionMetrics);
      const firstActionLabel = metricsSnapshot.firstUsefulActionDelayMs === null
        ? t('metrics.pending')
        : formatSessionDuration(metricsSnapshot.firstUsefulActionDelayMs);
      const priorityResolutionLabel = metricsSnapshot.averagePriorityResolutionMs === null
        ? t('metrics.pending')
        : formatSessionDuration(metricsSnapshot.averagePriorityResolutionMs);
      const actionBreakdownLabel = formatActionBreakdown(metricsSnapshot.actionBreakdown);
      metricsElement.textContent = `${t('metrics.session')}: ${t('metrics.firstAction')} ${firstActionLabel} • ${metricsSnapshot.actionCount} ${t('metrics.actions')} • ${t('metrics.priorityResolution')} ${priorityResolutionLabel} • ${t('metrics.breakdown')} ${actionBreakdownLabel}`;
    }

    function trackUsefulAction(actionType = 'other') {
      sessionMetrics = trackSessionAction(sessionMetrics, actionType, Date.now());
      updateSessionMetricsUI();
    }

    function onUsefulLinkAction() {
      trackUsefulAction('open');
      return true;
    }

    function activateOnKeydown(event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      event.currentTarget.click();
    }

    function safeDecodeURIComponent(value) {
      try {
        return decodeURIComponent(String(value ?? ''));
      } catch {
        return String(value ?? '');
      }
    }

    function getNotificationMrNumber(review) {
      return typeof review.mrNumber === 'number' ? String(review.mrNumber) : '?';
    }

    function mapNotificationToToast(notification) {
      const mrNumber = getNotificationMrNumber(notification.review);
      switch (notification.kind) {
        case 'reviewStarted':
          return { message: t('notify.reviewStarted', { mrNumber }), type: 'info' };
        case 'followupStarted':
          return { message: t('notify.followupStarted', { mrNumber }), type: 'info' };
        case 'reviewCompleted':
          return { message: t('notify.reviewCompleted', { mrNumber }), type: 'success' };
        case 'followupCompleted':
          return { message: t('notify.followupCompleted', { mrNumber }), type: 'success' };
        case 'reviewFailed':
          return { message: t('notify.reviewFailed', { mrNumber }), type: 'error' };
        default:
          return null;
      }
    }

    function maybeShowDesktopNotification(notification) {
      if (typeof Notification === 'undefined') return;

      const shouldNotify = shouldNotifyDesktop({
        permission: Notification.permission,
        isDocumentHidden: document.visibilityState !== 'visible',
        notifyWhenVisible: true,
      });
      if (!shouldNotify) return;

      const desktopPayload = getDesktopNotificationPayload(notification, t);
      if (!desktopPayload) return;
      const desktopNotif = new Notification(desktopPayload.title, {
        body: desktopPayload.body,
        tag: desktopPayload.tag,
        icon: desktopPayload.iconDataUri,
      });
      desktopNotif.onclick = () => {
        window.focus();
        if (desktopPayload.url) {
          window.open(desktopPayload.url, '_blank', 'noopener');
        }
        desktopNotif.close();
      };
    }

    function dispatchReviewNotifications(activeReviews, recentReviews) {
      const result = collectReviewNotifications(reviewNotificationState, activeReviews, recentReviews);
      reviewNotificationState = result.nextState;
      console.log('[notify] dispatch', {
        active: activeReviews.map(r => ({ id: r.id, status: r.status, jobType: r.jobType, mr: r.mrNumber })),
        recent: recentReviews.slice(0, 5).map(r => ({ id: r.id, status: r.status, jobType: r.jobType, mr: r.mrNumber, completedAt: r.completedAt })),
        emitted: result.notifications.map(n => ({ kind: n.kind, mr: n.review.mrNumber })),
      });
      result.notifications.forEach((notification) => {
        const toastPayload = mapNotificationToToast(notification);
        if (!toastPayload) return;
        showToast(toastPayload.message, toastPayload.type);
        maybeShowDesktopNotification(notification);
      });
    }

    function renderLog(log) {
      const dataStr = log.data ? escapeHtml(JSON.stringify(log.data, null, 2)) : '';
      const logLevel = typeof log.level === 'string' ? log.level : 'info';
      const safeLogLevelClass = logLevel.replace(/[^a-zA-Z0-9-]/g, '-');
      return `
        <div class="log-entry">
          <span class="log-time">${formatLogTime(log.timestamp)}</span>

    async function toggleReviewAccordion(encodedFilename) {
      const filename = safeDecodeURIComponent(encodedFilename);
      const accordion = document.querySelector(`.review-accordion[data-filename="${encodedFilename}"]`);
      const isOpen = accordion.classList.contains('open');

      document.querySelectorAll('.review-accordion.open').forEach(el => {
        if (el !== accordion) el.classList.remove('open');
      });

      if (isOpen) {
        accordion.classList.remove('open');
        return;
      }

      accordion.classList.add('open');
      const contentId = `review-content-${encodedFilename.replace(/[^a-zA-Z0-9-]/g, '-')}`;
      const contentEl = document.getElementById(contentId);

      if (!loadedReviews[filename]) {
        try {
          const response = await fetch(`${API_URL}/api/reviews/${filename}`);
          const data = await response.json();
          loadedReviews[filename] = data.content;
        } catch (error) {
          contentEl.innerHTML = `<div class="empty-state">${t('error.loading')}</div>`;
          return;
        }
      }

      contentEl.innerHTML = markdownToHtml(loadedReviews[filename]);
    }

    async function initBudgetSlider() {
      const slider = document.getElementById('budget-slider');
      const valueLabel = document.getElementById('budget-slider-value');
      const submitButton = document.getElementById('budget-slider-submit');
      const statusLabel = document.getElementById('budget-slider-status');
      if (!slider || !valueLabel || !submitButton || !statusLabel) return;

      try {
        const config = await fetchBudget();
        slider.value = String(config.limitUsd);
        valueLabel.textContent = `$${config.limitUsd}`;
      } catch (error) {
        console.error('Error fetching budget:', error);
      }

      slider.addEventListener('input', () => {
        valueLabel.textContent = `$${slider.value}`;
      });

      submitButton.addEventListener('click', async () => {
        statusLabel.textContent = '';
        const limitUsd = Number(slider.value);
        try {
          const result = await submitBudget(limitUsd);
          if (result.success) {
            statusLabel.textContent = 'Saved';
            statusLabel.className = 'budget-slider-status budget-slider-status--ok';
            await refreshBudgetTile();
          } else {
            statusLabel.textContent = result.error || 'Failed';
            statusLabel.className = 'budget-slider-status budget-slider-status--error';
          }
        } catch (error) {
          console.error('Error submitting budget:', error);
          statusLabel.textContent = 'Network error';
          statusLabel.className = 'budget-slider-status budget-slider-status--error';
        }
      });
    }

    function exportInsightsPdf() {
      if (!currentInsightsData || currentInsightsData.isEmpty) return;

      const reportHtml = buildInsightsReport(currentInsightsData, t);

      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = 'none';
      document.body.appendChild(iframe);

      const document_ = iframe.contentDocument || iframe.contentWindow.document;
      document_.open();
      document_.write(reportHtml);
      document_.close();

      iframe.contentWindow.addEventListener('afterprint', () => {
        if (iframe.parentNode) document.body.removeChild(iframe);
      });

      setTimeout(() => {
        iframe.contentWindow.print();
        setTimeout(() => {
          if (iframe.parentNode) document.body.removeChild(iframe);
        }, 60000);
      }, 250);
    }

    function updatePendingReviewsUI() {
      const section = document.getElementById('pending-reviews-section');
      const container = document.getElementById('pending-reviews');
      const countBadge = document.getElementById('pending-reviews-count');
      if (!container || !countBadge || !section) return;

      if (shouldHidePendingReviewsSection({ pendingReviews: currentData.pendingReviews })) {
        section.classList.add('hidden');
        container.innerHTML = '';
        countBadge.classList.add('hidden');
        countBadge.textContent = '0';
        return;
      }
      section.classList.remove('hidden');

      const model = buildPendingReviewsModel(currentData.pendingReviews || []);
      container.innerHTML = renderPendingReviewsHtml(model);

      if (model.isEmpty) {
        countBadge.classList.add('hidden');
        countBadge.textContent = '0';
      } else {
        countBadge.textContent = String(model.count);
        countBadge.classList.remove('hidden');
      }

      const disablePendingCardActions = (fromButton) => {
        const card = fromButton.closest('.pending-review-card');
        if (!card) return;
        card.querySelectorAll('.btn-confirm-pending, .btn-dismiss-pending').forEach((action) => {
          action.disabled = true;
        });

      container.querySelectorAll('.btn-confirm-pending').forEach((btn) => {
        const pendingId = btn.getAttribute('data-pending-id');

    function connectWebSocket() {
      if (ws?.readyState === WebSocket.OPEN) return;

      updateConnectionStatus('connecting', 'status.connecting');

      try {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          wsConnected = true;
          reconnectAttempts = 0;
          updateConnectionStatus('online', 'connection.online');
        };

        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            switch (message.type) {
              case 'init':
              case 'state':
                console.log(`[WS] ${message.type}: ${message.activeReviews?.length || 0} active reviews`, message.activeReviews);
                currentData.activeReviews = message.activeReviews || [];
                currentData.recentReviews = message.recentReviews || [];
                dispatchReviewNotifications(currentData.activeReviews, currentData.recentReviews);
                updateUI();
                if (message.type === 'state') {
                  fetchMrTracking();
                }
                if (activeTabId === 'overview') {
                  refreshOverviewSection();
                }
                break;
              case 'progress':
                handleProgressUpdate(message);
                break;
              case 'log':
                handleLogMessage(message.log);
                break;
              case 'backfill-progress': {
                const progressBadge = document.getElementById('backfill-progress');
                if (progressBadge) {
                  progressBadge.textContent = t('stats.backfillProgress', { completed: message.data.completed, total: message.data.total });
                  progressBadge.classList.remove('hidden');
                }
                break;
              }
              case 'backfill-complete': {
                const completeBadge = document.getElementById('backfill-progress');
                const recalcButton = document.getElementById('recalculate-btn');
                if (completeBadge) {
                  completeBadge.textContent = t('stats.backfillComplete');
                  setTimeout(() => completeBadge.classList.add('hidden'), 3000);
                }
                if (recalcButton) recalcButton.disabled = false;
                fetchProjectStats();
                fetchTeamInsights();
                break;
              }
              case 'budget-status': {
                const statusViewModel = parseBudgetStatusMessage(message);
                if (statusViewModel) {
                  const budgetTile = document.getElementById('budget-tile');
                  if (budgetTile) {
                    budgetTile.innerHTML = renderBudgetTile(statusViewModel);
                  }
                }
                break;
              }
              case 'budget-exceeded': {
                const payload = parseBudgetExceededMessage(message);
                if (payload) {
                  showToast(
                    `Budget dépassé — review !${payload.mrNumber} bloquée (${payload.consumedUsd.toFixed(2)}$ / ${payload.limitUsd}$)`,
                    'error',
                  );
                }
                break;
              }
              case 'pending-changed':
                fetchPendingReviews();
                break;
              case 'pong':
                break;
            }
          } catch (e) {
            console.error('WebSocket message error:', e);
          }
        };

        ws.onclose = () => {
          wsConnected = false;
          ws = null;
          updateConnectionStatus(hasLoadedStatusOnce ? 'online' : 'connecting');
          if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
            reconnectAttempts++;
            setTimeout(connectWebSocket, RECONNECT_DELAY);
          }
        };

        ws.onerror = (error) => console.error('WebSocket error:', error);

      } catch (error) {
        console.error('WebSocket creation failed:', error);
        wsConnected = false;
      }
    }

    setInterval(() => {
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 30000);

    function bindSettingsModalForm(dialog) {
      const form = dialog.querySelector('form.settings-modal__form');
      const cancelBtn = dialog.querySelector('.settings-modal__cancel');
      const errorEl = dialog.querySelector('.settings-modal__error');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', (event) => {
          event.preventDefault();
          closeSettingsModal();
        });
      }
      if (!form) return;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (errorEl) errorEl.textContent = '';
        const formData = new FormData(form);
        const payload = extractFormPayload(formData);
        const linkValidation = validateExternalLink(payload.externalLink ?? '');
        if (!linkValidation.ok) {
          if (errorEl) errorEl.textContent = linkValidation.message;
          return;
        }
        const thresholdRaw = payload.qualityThreshold ?? '';
        const thresholdValidation = validateQualityThreshold(thresholdRaw);
        if (!thresholdValidation.ok) {
          if (errorEl) errorEl.textContent = thresholdValidation.message;
          return;
        }
        const capRaw = payload.maxConcurrentReviews ?? '';
        const capValidation = validateMaxConcurrentReviews(capRaw);
        if (!capValidation.ok) {
          if (errorEl) errorEl.textContent = capValidation.message;
          return;
        }
        const maxDiffLinesRaw = payload.maxDiffLines ?? '';
        const maxDiffLinesValidation = validateMaxDiffLines(maxDiffLinesRaw);
        if (!maxDiffLinesValidation.ok) {
          if (errorEl) errorEl.textContent = maxDiffLinesValidation.message;
          return;
        }
        const requestBody = { ...payload };
        requestBody.qualityThreshold = thresholdRaw === '' ? null : thresholdRaw;
        requestBody.maxConcurrentReviews = Number(capRaw);
        requestBody.maxDiffLines = maxDiffLinesRaw === '' ? null : Number(maxDiffLinesRaw);
        try {
          const response = await fetch(
            `${API_URL}/api/project-config?path=${encodeURIComponent(activeTabId)}`,
            {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },

    async function handleAddProjectSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const input = form.querySelector('input.add-form-input');
      const submit = form.querySelector('button.add-form-submit');
      const rawValue = input ? input.value : '';
      const validation = validateLocalPathInput(rawValue);
      clearManagePanelError();
      if (!validation.ok) {
        const message = validation.reason === 'empty' ? 'Chemin du projet requis' : 'Le chemin doit être absolu';
        setManagePanelError(message);
        flashAddFormError();
        return;
      }
      const trimmed = rawValue.trim();
      if (submit) submit.classList.add('is-busy');
      try {
        const response = await fetch(`${API_URL}/api/repositories`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ localPath: trimmed }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          setManagePanelError(typeof body?.error === 'string' ? body.error : 'Erreur inconnue');
          flashAddFormError();
          return;
        }
        syncAvailableRepositoriesFromResponse(body);
        if (input) input.value = '';
        flashAddFormSuccess();
        renderManagePanel();
        renderDashboardTabs();
        flashTabEntering(trimmed);
      } catch {
        setManagePanelError('Erreur réseau');
        flashAddFormError();
      } finally {
        if (submit) submit.classList.remove('is-busy');
      }
    }

    async function triggerVersionUpdate() {
      setVersionCheckState('updating', t);
      try {
        const response = await fetch(`${API_URL}/api/version/update`, { method: 'POST' });
        const data = await response.json();
        if (data.status === 'started') {
          setVersionCheckState('restarting', t);
          showToast(t('version.restarting'), 'info');
          setTimeout(() => {
            const checkInterval = setInterval(async () => {
              try {
                const healthResponse = await fetch(`${API_URL}/health`);
                if (healthResponse.ok) {
                  clearInterval(checkInterval);
                  window.location.reload();
                }
              } catch {
                // Server still restarting, keep polling
              }
            }, 2000);
            setTimeout(() => clearInterval(checkInterval), 60000);
          }, 3000);
        } else if (data.status === 'permission-denied') {
          setVersionCheckState('idle', t);
          showManualUpdateCommand(data.command);
        } else if (data.status === 'refused') {
          showToast(resolveRefusalWording(data.motive, t), 'error');
          setVersionCheckState('idle', t);
        } else {
          showToast(data.error || t('version.updateFailed'), 'error');
          setVersionCheckState('idle', t);
        }
      } catch (error) {
        console.error('Error triggering update:', error);
        showToast(t('version.updateFailed'), 'error');
        setVersionCheckState('idle', t);
      }
    }

      container.innerHTML = renderLiveReviewsHtml(buildLiveReviewsModel(currentData.activeReviews, Date.now()), t);
    }

    function renderReviewQueue() {
      const container = document.getElementById('review-queue');
      if (!container) return;
      const isOverview = activeTabId === 'overview';
      container.hidden = isOverview;
      const completedSection = document.getElementById('completed-reviews-section');
      if (completedSection) completedSection.hidden = isOverview;
      const overviewSection = document.getElementById('overview-section');
      if (overviewSection) overviewSection.hidden = !isOverview;
      if (isOverview) {
        lastQueueModel = null;
      } else {
        lastQueueModel = buildReviewQueueModel({
          pendingFix: currentData.pendingFix,
          pendingApproval: currentData.pendingApproval,
          activeJobs: currentData.activeReviews,
          projectAliases: currentProjectAliases(),
          nowMs: Date.now(),
          activeLane,
          authorFilter,
        });
        container.setAttribute('aria-label', t('queue.lanesLabel'));
        container.innerHTML = renderReviewQueueHtml(lastQueueModel, t, {
          selectedId: selectedMrId,
          armedNudge,
          isLoading: loadingState.mrTracking > 0,
        });
      }
      renderViewNav();
      renderSidePanel();
    }

    function trackedMergeRequestById(mrId) {
      return [...currentData.pendingFix, ...currentData.pendingApproval].find((mergeRequest) => mergeRequest.id === mrId) ?? null;
    }

    function selectedQueueRow() {
      if (activeView !== 'queue' || selectedMrId === null) return null;
      return lastQueueModel?.allRows.find((row) => row.id === selectedMrId) ?? null;
    }

    function renderSidePanel() {
      const row = selectedQueueRow();
      const showPr = panelTab === 'pr' && row !== null;
      const tabs = document.getElementById('panel-tabs');
      if (tabs) {
        tabs.setAttribute('aria-label', t('panel.label'));
        tabs.innerHTML = renderPanelTabsHtml({ activeTab: showPr ? 'pr' : 'ember', selection: row }, t);
      }
      const prPanel = document.getElementById('panel-pr');
      const emberPanel = document.getElementById('ember-chat-panel');
      if (prPanel) {
        prPanel.hidden = !showPr;
        prPanel.innerHTML = showPr ? renderPrDetailHtml(buildPrDetailModel(row, trackedMergeRequestById(row.id)), t) : '';
      }
      if (emberPanel) emberPanel.hidden = showPr;
      emberSelection = row ? { prefix: row.prefix, mrNumber: row.mrNumber, subject: row.subject } : null;
      const contextChip = document.getElementById('ember-context');
      if (contextChip) {
        contextChip.hidden = emberSelection === null;
        contextChip.textContent = emberSelection ? t('ember.context', { prefix: emberSelection.prefix, number: emberSelection.mrNumber }) : '';
      }
      refreshIcons();
    }

    function selectMergeRequest(mrId) {
      selectedMrId = mrId;
      panelTab = 'pr';
      renderReviewQueue();
    }

    function disarmNudge() {
      armedNudge = null;
      if (armedNudgeTimer) clearTimeout(armedNudgeTimer);
      armedNudgeTimer = null;
    }

    function armNudge(key) {
      disarmNudge();
      armedNudge = key;
      armedNudgeTimer = setTimeout(() => {
        armedNudge = null;
        renderReviewQueue();
      }, 6000);
      renderReviewQueue();
    }

    async function nudgeAuthors(mrIds) {
      disarmNudge();
      renderReviewQueue();
      if (!currentProjectPath || mrIds.length === 0) return;
      trackUsefulAction('other');
      try {
        const response = await fetch(`${API_URL}/api/mr-tracking/nudge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectPath: currentProjectPath, mrIds, language: getLanguage() }),
        });
        const data = await response.json();
        const nudged = Array.isArray(data?.nudged) ? data.nudged.length : 0;
        if (nudged > 0) showToast(t('queue.toast.nudged', { count: nudged }), 'success');
        if (!data?.success || (Array.isArray(data?.failed) && data.failed.length > 0)) {
          showToast(t('queue.toast.nudgeFailed'), 'error');
        }
      } catch (error) {
        console.error('Error nudging authors:', error);
        showToast(t('queue.toast.nudgeFailed'), 'error');
      }
    }

    function handleShellAction(action, element) {
      const mrId = element.dataset.mrId ?? '';
      switch (action) {
        case 'view':
          setActiveView(element.dataset.view);
          return true;
        case 'lane':
          activeLane = element.dataset.lane;
          disarmNudge();
          renderReviewQueue();
          return true;
        case 'author':
          authorFilter = element.dataset.author || null;
          renderReviewQueue();
          return true;
        case 'select':
          selectMergeRequest(mrId);
          return true;
        case 'close-detail':
          selectedMrId = null;
          panelTab = 'ember';
          renderReviewQueue();
          return true;
        case 'panel-tab':
          panelTab = element.dataset.tab === 'pr' ? 'pr' : 'ember';
          renderSidePanel();
          return true;
        case 'followup':
          triggerFollowup(encodeURIComponent(mrId));
          return true;
        case 'cancel':
          showCancelModal(encodeURIComponent(element.dataset.jobId ?? ''), Number(element.dataset.mrNumber), element.dataset.jobType ?? 'review');
          return true;
        case 'nudge':
          if (armedNudge === mrId) nudgeAuthors([mrId]);
          else armNudge(mrId);
          return true;
        case 'nudge-all':
          if (armedNudge === 'all') nudgeAuthors(lastQueueModel?.dormantIds ?? []);
          else armNudge('all');
          return true;
        case 'sync-threads':
          syncGitLabThreads(element);
          return true;
        case 'mark-merged':
          showMarkMergedModal(encodeURIComponent(mrId), Number(element.dataset.mrNumber));
          return true;
        case 'open-history':
          openMrSheet(encodeURIComponent(mrId));
          return true;
        case 'approve':
          trackUsefulAction('approve');
          return false;
        case 'toggle-health':
          healthOpen = !healthOpen;
          projectSwitcherOpen = false;
          renderHealth();
          renderProjectSwitcher();
          return true;
        case 'toggle-projects':
          projectSwitcherOpen = !projectSwitcherOpen;
          healthOpen = false;
          renderHealth();
          renderProjectSwitcher();
          return true;
        case 'recheck-claude':
          checkClaudeStatus();
          return true;
        case 'ember-suggestion':
          askEmber(element.dataset.question ?? element.textContent ?? '');
          return true;
        default:
          return false;
      }
    }

    function bindShellEvents() {
      document.addEventListener('click', (event) => {
        const origin = event.target instanceof Element ? event.target : null;
        if (origin && !origin.closest('.health') && !origin.closest('.project-switcher') && (healthOpen || projectSwitcherOpen)) {
          closePopovers();
        }
        const actionElement = origin?.closest('[data-action]');
        if (!actionElement || actionElement.tagName === 'INPUT') return;
        handleShellAction(actionElement.dataset.action, actionElement);
      });
      document.addEventListener('change', (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.dataset.action !== 'toggle-auto-followup') return;
        toggleAutoFollowup(encodeURIComponent(input.dataset.mrId ?? ''), input.checked);
      });
    }

    function renderEmberSuggestions() {
      const container = document.getElementById('ember-suggestions');
      if (!container) return;
      container.innerHTML = ['ember.suggestion.oldest', 'ember.suggestion.followups', 'ember.suggestion.week']
        .map((key) => `<button type="button" class="suggestion" data-action="ember-suggestion">${escapeHtml(t(key))}</button>`)
        .join('');
    }

    let askEmber = () => {};


    // Expose functions to HTML onclick handlers
    window.checkForUpdates = checkForUpdates;
    window.triggerVersionUpdate = triggerVersionUpdate;
    window.copyUpdateCommand = copyUpdateCommand;
    window.toggleCollapsibleList = toggleCollapsibleList;
    window.checkClaudeStatus = checkClaudeStatus;
    window.toggleLogs = toggleLogs;
    window.changeModel = changeModel;
    window.changeTriggerMode = changeTriggerMode;
    window.changeReviewTimeout = changeReviewTimeout;
    window.changeLanguage = changeLanguage;
    window.toggleReviewAccordion = toggleReviewAccordion;
    window.deleteReviewFile = deleteReviewFile;
    window.triggerFollowup = triggerFollowup;
    window.toggleAutoFollowup = toggleAutoFollowup;
    window.approveMr = approveMr;
    window.showCancelModal = showCancelModal;
    window.closeCancelModal = closeCancelModal;
    window.confirmCancelReview = confirmCancelReview;
    window.showMarkMergedModal = showMarkMergedModal;
    window.closeMarkMergedModal = closeMarkMergedModal;
    window.confirmMarkAsMerged = confirmMarkAsMerged;
    window.onUsefulLinkAction = onUsefulLinkAction;
    window.activateOnKeydown = activateOnKeydown;
    window.handleCleanupClick = handleCleanupClick;
    window.openMrSheet = openMrSheet;
    window.closeMrSheet = closeMrSheet;
    window.openDevSheet = openDevSheet;
    window.closeDevSheet = closeDevSheet;
    window.openEconomicsSheet = openEconomicsSheet;
    window.closeEconomicsSheet = closeEconomicsSheet;
    window.openStatsSheet = openStatsSheet;
    window.generateAiInsights = generateAiInsights;
    window.exportInsightsPdf = exportInsightsPdf;
    window.toggleTeamAnalysis = toggleTeamAnalysis;
    window.clearLogs = clearLogs;

    // Init cleanup section
    const cleanupContent = document.getElementById('cleanup-content');
    if (cleanupContent) {
      cleanupContent.innerHTML = renderCleanupSection(14);
    }

    // Init
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    bindShellEvents();
    setActiveView(activeView);
    renderStaticLabels();
    renderHealth();
    renderEmberSuggestions();
    updateSessionMetricsUI();
    connectWebSocket();
    fetchStatus();
    checkClaudeStatus();
    loadModelSetting();
    loadTriggerModeSetting();
    loadReviewTimeoutSetting();
    loadLanguageSetting();
    initOverviewAndTabs();
    refreshBudgetTile();
    initBudgetSlider();

    // Initialize Lucide icons
    refreshIcons();

    setInterval(fetchStatus, 5000);
    setInterval(() => {
      fetchReviewFiles();
      fetchProjectStats();
      fetchMrTracking();
      fetchPendingReviews();
      fetchTeamInsights();
    }, 30000);

    fetchPendingReviews();

    setInterval(() => {
      document.querySelectorAll('[data-elapsed-for]').forEach((element) => {
        const review = currentData.activeReviews.find((candidate) => candidate.id === element.dataset.elapsedFor);
        if (review?.startedAt) element.textContent = formatElapsed(Date.now() - Date.parse(review.startedAt));
      });
    }, 1000);

    // SPEC-173 — Worktree pool panel
    const worktreeSection = document.getElementById('worktree-section');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let animeApi = null;
    let lastWorktreeTotals = { total: null, active: null, idle: null, stale: null };

    async function loadAnimeApi() {
      if (prefersReducedMotion) return null;
      if (animeApi !== null) return animeApi;
      try {
        animeApi = await import('./vendor/anime.esm.min.js');
        return animeApi;
      } catch (error) {
        animeApi = null;
        return null;
      }
    }

    function bindWorktreeSweepButton() {
      const button = worktreeSection?.querySelector('[data-action="sweep"]');
      if (!button) return;
      button.addEventListener('click', async () => {
        if (button.dataset.busy === '1') return;
        button.dataset.busy = '1';
        const label = button.querySelector('.worktree-sweep-label');
        const previousLabel = label?.textContent ?? 'SWEEP NOW';
        if (label) label.textContent = 'SWEEPING…';
        button.classList.add('worktree-sweep-pending');

        const anime = await loadAnimeApi();
        const broom = button.querySelector('.worktree-sweep-broom');
        if (anime && broom) {
          anime.animate(broom, {
            translateX: [{ from: -6, to: 22 }],
            opacity: [{ from: 0.6, to: 1 }],
            duration: 700,
            easing: 'easeInOutQuad',
          });
        }

        try {
          const result = await triggerManualSweep();
          if (result.status === 'conflict') {
            button.classList.add('worktree-sweep-conflict');
            window.setTimeout(() => button.classList.remove('worktree-sweep-conflict'), 1200);
          } else if (result.status === 'error') {
            button.classList.add('worktree-sweep-error');
            window.setTimeout(() => button.classList.remove('worktree-sweep-error'), 1200);
          }
        } finally {
          if (label) label.textContent = previousLabel;
          button.classList.remove('worktree-sweep-pending');
          button.dataset.busy = '0';
          await refreshWorktreeSection({ animate: true });
        }
      });
    }

    function animateWorktreeMetrics() {
      if (prefersReducedMotion || worktreeSection === null) return;
      loadAnimeApi().then((anime) => {
        if (anime === null) return;
        const metrics = worktreeSection.querySelectorAll('.worktree-metric-value');
        if (metrics.length === 0) return;
        anime.animate(metrics, {
          opacity: [{ from: 0, to: 1 }],
          translateY: [{ from: 4, to: 0 }],
          duration: 400,
          delay: anime.stagger(40),
          easing: 'easeOutQuad',
        });
        const rows = worktreeSection.querySelectorAll('.worktree-row');
        if (rows.length === 0) return;
        anime.animate(rows, {
          opacity: [{ from: 0, to: 1 }],
          translateY: [{ from: 2, to: 0 }],
          duration: 260,
          delay: anime.stagger(25),
          easing: 'easeOutQuad',
        });
      }).catch(() => {});
    }

    function flashChangedMetrics(nextTotals) {
      if (prefersReducedMotion || worktreeSection === null) return;
      const changedKeys = computeChangedMetricKeys(lastWorktreeTotals, nextTotals);
      if (changedKeys.length === 0) return;
      const changed = [];
      for (const key of changedKeys) {
        const el = worktreeSection.querySelector(`.worktree-metric-value[data-metric="${key}"]`);
        if (el) changed.push(el);
      }
      if (changed.length === 0) return;
      loadAnimeApi().then((anime) => {
        if (anime === null) return;
        anime.animate(changed, {
          backgroundColor: [{ from: 'rgba(255, 138, 61, 0.18)', to: 'rgba(255, 138, 61, 0)' }],
          duration: 600,
          easing: 'easeOutQuad',
        });
      }).catch(() => {});
    }

    function bindForceCleanupButtons() {
      if (worktreeSection === null) return;
      const buttons = worktreeSection.querySelectorAll('[data-action="force-cleanup"]');
      buttons.forEach((button) => {
        button.addEventListener('click', async () => {
          if (button.dataset.busy === '1') return;
          const platform = button.dataset.platform;
          const projectPath = button.dataset.projectPath;
          const mrNumber = Number(button.dataset.mrNumber);
          if (!platform || !projectPath || Number.isNaN(mrNumber)) return;

          button.dataset.busy = '1';
          try {
            const result = await triggerForceCleanup({ platform, projectPath, mrNumber });
            if (result.status !== 'ok') {
              button.classList.add('worktree-cleanup-failed');
              window.setTimeout(() => button.classList.remove('worktree-cleanup-failed'), 1200);
            }
          } finally {
            button.dataset.busy = '0';
            await refreshWorktreeSection({ animate: true });
          }
        });
      });
    }

    async function refreshWorktreeSection({ animate } = { animate: false }) {
      if (worktreeSection === null) return;
      try {
        const viewModel = await fetchWorktreeOverview();
        worktreeHealth = {
          active: viewModel.activeCount ?? 0,
          disk: formatBytes(viewModel.totalSizeBytes ?? 0),
          failed: viewModel.degradedCount ?? 0,
        };
        renderHealth();
        renderViewNav();
        const totals = snapshotTotals(viewModel);
        worktreeSection.innerHTML = renderWorktreeSection(viewModel);
        bindWorktreeSweepButton();
        bindForceCleanupButtons();
        if (animate) animateWorktreeMetrics();
        flashChangedMetrics(totals);
        lastWorktreeTotals = totals;
      } catch (error) {
        if (worktreeSection.childElementCount === 0) {
          worktreeSection.innerHTML = '<div class="worktree-panel worktree-panel-error">// WORKTREE POOL · unavailable</div>';
        }
      }
    }

    refreshWorktreeSection({ animate: true });
    setInterval(() => refreshWorktreeSection({ animate: false }), 5000);

    const sizeBlockSection = document.getElementById('size-block-section');

    function bindForceLaunchButtons() {
      if (sizeBlockSection === null) return;
      const buttons = sizeBlockSection.querySelectorAll('[data-action="force-launch"]');
      buttons.forEach((button) => {
        button.addEventListener('click', async () => {
          if (button.dataset.busy === '1') return;
          const mrId = button.dataset.mrId;
          const projectPath = button.dataset.projectPath;
          if (!mrId || !projectPath) return;

          button.dataset.busy = '1';
          try {
            const result = await triggerForceLaunch({ mrId, projectPath });
            if (!result.success) {
              button.classList.add('size-block-force-failed');
              window.setTimeout(() => button.classList.remove('size-block-force-failed'), 1200);
            }
          } finally {
            button.dataset.busy = '0';
            await refreshSizeBlockSection();
          }
        });
      });
    }

    async function refreshSizeBlockSection() {
      if (sizeBlockSection === null) return;
      try {
        const payload = await fetchSizeBlocks();
        const viewModel = buildSizeBlockPanelModel(payload);
        sizeBlockSection.innerHTML = renderSizeBlockPanelHtml(viewModel);
        bindForceLaunchButtons();
      } catch (error) {
        sizeBlockSection.innerHTML = '';
      }
    }

    refreshSizeBlockSection();
    setInterval(() => refreshSizeBlockSection(), 5000);

    // === Operator's Console boot animations ===


    async function bootAnimations() {
      const anime = await loadAnimeApi();
      if (!anime) return;
      wireSettingsModal(anime);
    }

    function wireSettingsModal(anime) {
      const modal = document.getElementById('settings-modal');
      if (!modal) return;
      modal.addEventListener('animationsjs-open', () => springIn(modal, { animeApi: anime }));
    }



    // Observe counter element changes

    // Ember read-only chat (SPEC-189). The pure decisions + SSE fold live in
    // emberChat.js; this humble init just binds DOM and the reused avatar.
    function initEmberChat() {
      const form = document.getElementById('ember-form');
      const input = document.getElementById('ember-question');
      const thread = document.getElementById('ember-thread');
      const status = document.getElementById('ember-status');
      const retry = document.getElementById('ember-retry');
      const canvas = document.getElementById('ember-avatar');
      const panel = document.getElementById('ember-chat-panel');
      if (!form || !input || !thread || !status || !canvas) return;

      const avatar = mountEmberAvatar({ canvas, initialState: 'idle' });

      const appendBubble = (role, text) => {
        const bubble = document.createElement('div');
        bubble.className = 'ember-chat-panel__msg ember-chat-panel__msg--' + role;
        bubble.textContent = text;
        thread.appendChild(bubble);
        thread.scrollTop = thread.scrollHeight;
        return bubble;
      };

      let lastQuestion = '';
      const ask = async (questionText) => {
        const question = questionText ?? input.value;
        if (!shouldSendQuestion(question)) {
          input.focus();
          return;
        }
        panelTab = 'ember';
        renderSidePanel();
        lastQuestion = question;
        panel?.classList.add('ember-chat-panel--active');
        status.textContent = '';
        retry.hidden = true;
        appendBubble('user', question);
        input.value = '';
        input.disabled = true;
        const answerBubble = appendBubble('ember', '');
        answerBubble.classList.add('is-generating');
        answerBubble.innerHTML = '<span class="ember-typing" aria-hidden="true"><i></i><i></i><i></i></span>';
        let errored = false;
        await connectEmberStream({
          question: contextualQuestion(question, emberSelection, t),
          onAnswer: (text) => { answerBubble.innerHTML = markdownToHtml(text); thread.scrollTop = thread.scrollHeight; },
          onAvatarState: (state) => { avatar.setState(state); if (state === 'error') errored = true; },
          onAnnounce: (text) => {
            status.textContent = text;
            if (errored) answerBubble.innerHTML = markdownToHtml(text);
          },
          onRetryVisible: (visible) => { retry.hidden = !visible; },
        });
        answerBubble.classList.remove('is-generating');
        answerBubble.classList.add(errored ? 'is-error' : 'is-answered');
        thread.scrollTop = thread.scrollHeight;
        input.disabled = false;
        input.focus();
      };
      askEmber = (question) => { void ask(question); };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        void ask();
      });
      retry.addEventListener('click', () => { void ask(lastQuestion); });
    }

    // Boot animations & observers exactly once, regardless of readyState timing
    let __animationsBooted = false;
    function bootOnce() {
      if (__animationsBooted) return;
      __animationsBooted = true;
      bootAnimations();
      initEmberChat();
    }
    if (document.readyState !== 'loading') {
      bootOnce();
    } else {
      window.addEventListener('DOMContentLoaded', bootOnce);
    }
  </script>
